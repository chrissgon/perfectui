name: publish to npm

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Cheap gate. The full suite runs in ci.yml on the way to main.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run size
      - run: bun run test:exports

      # A prerelease must not take the latest tag: 1.0.0-beta.0 published
      # without this would become what `npm i` and the CDN's @latest resolve to.
      - name: Pick the dist-tag from the version
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "dist=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "publishing $version under the ${dist:-} tag"

      - name: Publish
        run: npm publish --tag ${{ steps.tag.outputs.dist }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PERFECTUI_TOKEN }}
