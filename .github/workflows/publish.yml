name: publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write creates the GitHub release; id-token: write is the identity npm's
      # trusted publishing checks instead of a stored token.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag, for release notes generated from the changelog
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@12.1.0

      - run: bun install --frozen-lockfile

      # Cheap gate. The full suite runs in ci.yml on the way to main.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run size
      - run: bun run test:exports

      # A prerelease must not take the latest tag: 1.0.0-beta.0 published
      # without this would become what `npm i` and the CDN's @latest resolve to.
      - name: Pick the dist-tag from the version
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "dist=beta" >> "$GITHUB_OUTPUT"
          else
            echo "dist=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "publishing $version under the ${dist:-} tag"

      # Trusted publishing (npmjs.com: package settings, trusted publisher = this repository and
      # this workflow file): npm exchanges the job's OIDC identity for a one-off credential, so no
      # token is stored in the repository. Provenance is attached automatically.
      - name: Publish
        run: npm publish --tag ${{ steps.tag.outputs.dist }} --provenance --access public

      # Release notes: release-notes/<tag>.md when the release has hand-written notes (a major),
      # otherwise the changelog since the previous tag.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            previous=$(git describe --tags --abbrev=0 "$tag^")
            bunx changelogen --from "$previous" --to "$tag" > /tmp/notes.md
            notes=/tmp/notes.md
          fi
          prerelease=""
          if [[ "$tag" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$notes" $prerelease
